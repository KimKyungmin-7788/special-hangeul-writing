<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">

<meta name="description" content="자음·모음을 손가락이나 펜으로 따라 쓰면 획순·방향·모양을 채점하고 고칠 점을 알려 주는 한글 쓰기 연습 도구예요. 선생님 점수를 모아 채점을 맞춰 가요.">

<meta property="og:site_name" content="한글 쓰기 연습">
<meta property="og:title" content="한글 쓰기 연습">
<meta property="og:description" content="자음·모음을 손가락이나 펜으로 따라 쓰면 획순·방향·모양을 채점하고 고칠 점을 알려 주는 한글 쓰기 연습 도구예요. 선생님 점수를 모아 채점을 맞춰 가요.">
<meta property="og:url" content="https://hangeul-one.vercel.app/">

<style>
  /* 앱마다 바꿀 디자인 변수 */
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d2433; --muted: #6b7280; --line: #e3e1da;
    --accent: #3b5bdb; --good: #2f9e44; --warn: #e8590c; --bad: #c92a2a;
    --guide: rgba(59, 91, 219, 0.13); --pen: #1d2433; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  main { display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; gap: 16px; max-width: 1100px; margin: 0 auto; padding: 16px; }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
  /* 칸 크기를 화면 너비로 계산하므로, 패널이 내용(칸 두 개) 때문에 넓어지지 않게 한다 */
  main > .panel { min-width: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab { flex: 1; font: inherit; font-size: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 8px; min-height: 40px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  @media (max-width: 860px) { .grid { grid-template-columns: repeat(7, 1fr); } }
  .cell { position: relative; aspect-ratio: 1; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 24px; font-weight: 700; color: var(--ink); cursor: pointer; }
  .cell[aria-current="true"] { border: 2px solid var(--accent); }
  .cell .badge { position: absolute; top: 3px; right: 4px; font-size: 10px; font-weight: 700; color: #fff; border-radius: 6px; padding: 1px 4px; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button.btn, select { font: inherit; font-size: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 9px 14px; min-height: 42px; cursor: pointer; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  label.toggle { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  /* 쓰기 칸: 오른쪽 아래 손잡이를 끌어 크기를 바꾼다(--pad-size) */
  /* 쓰기 칸과 모델링(획순 시범)을 나란히 둔다. 모델링은 쓰기 칸 오른쪽에, 같은 크기로 */
  .pad-row { display: flex; gap: 12px; justify-content: center; align-items: flex-start; width: 100%; }
  .pad-wrap { position: relative; width: min(100%, var(--pad-size, 420px)); flex: 0 0 auto; }
  .model-wrap { position: relative; width: var(--pad-size, 420px); flex: 0 0 auto; }
  .model-wrap[hidden] { display: none; }
  #model { width: 100%; aspect-ratio: 1; background: #fbfbf9; border: 1px solid var(--line); border-radius: var(--radius); display: block; touch-action: auto; }
  /* 넓은 화면에서 모델링을 켜면 글자 목록을 위 한 줄로 올려 두 칸이 넉넉히 들어가게 한다 */
  @media (min-width: 861px) {
    main.with-model { grid-template-columns: minmax(0, 1fr) 300px; }
    main.with-model > .panel:first-child { grid-column: 1 / -1; }
    main.with-model .grid { grid-template-columns: repeat(auto-fill, minmax(48px, 60px)); }
  }
  /* 재생·멈춤은 칸 아래에 둬서 획을 가리지 않게 */
  .model-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .model-cap { font-size: 13px; color: var(--muted); }
  .model-play { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .model-play:focus-visible, #modelBtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #modelBtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .pad-resize { position: absolute; right: -14px; bottom: -14px; width: 40px; height: 40px; border-radius: 50%; touch-action: none; cursor: nwse-resize; display: flex; align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .pad-resize::before { content: ""; width: 14px; height: 14px; border-right: 3px solid var(--muted); border-bottom: 3px solid var(--muted); border-radius: 0 0 3px 0; }
  .pad-resize:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .pad-size-label { position: absolute; right: 32px; bottom: -12px; font-size: 12px; color: var(--muted); background: var(--panel); padding: 2px 6px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .pad-wrap.resizing .pad-size-label { opacity: 1; }
  /* 자동 제출 원형 타이머: 펜을 떼면 쓰기 칸 오른쪽 위에서 줄어들며 돈다 */
  .auto-timer { position: absolute; top: 10px; right: 10px; width: 46px; height: 46px; pointer-events: none; opacity: 0; transition: opacity .15s; }
  .auto-timer.running { opacity: 1; }
  .auto-timer circle { fill: none; stroke-width: 3.5; }
  .auto-timer .track { stroke: var(--line); fill: var(--panel); }
  .auto-timer .ring { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 94.25; transform: rotate(-90deg); transform-origin: 18px 18px; }
  .auto-timer text { font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  #autoSec { width: 64px; font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 36px; }
  canvas { width: 100%; aspect-ratio: 1; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .toast { min-height: 22px; font-size: 15px; color: var(--warn); font-weight: 600; }
  .score { display: flex; align-items: baseline; gap: 8px; }
  .score b { font-size: 48px; }
  .grade { font-size: 18px; font-weight: 700; padding: 2px 8px; border-radius: 8px; color: #fff; }
  .bar { display: grid; grid-template-columns: 70px 1fr 36px; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
  .bar i { display: block; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar i span { display: block; height: 100%; background: var(--accent); }
  ul { padding-left: 18px; margin: 10px 0 0; font-size: 14px; line-height: 1.6; }
  .empty { color: var(--muted); font-size: 14px; }
  .calib { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .calib label { font-size: 13px; color: var(--muted); }
  .calib-row { display: flex; gap: 6px; margin-top: 6px; }
  .calib-row input { font: inherit; font-size: 16px; width: 90px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 42px; }
  .calib-msg { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .calib-issues { border: 0; padding: 0; margin: 10px 0 0; }
  .calib-issues legend { font-size: 13px; color: var(--muted); padding: 0; }
  .calib-issues .hint { font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .chip span { display: inline-flex; align-items: center; min-height: 36px; padding: 4px 11px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .chip input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip.none input:checked + span { background: var(--good); border-color: var(--good); }
  .iss { font-size: 13px; }
  .iss .miss { color: var(--bad); }
  .iss .extra { color: var(--muted); }
  .say { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 10px; background: #eef2ff; border-radius: 10px; font-size: 14px; }
  .say button { flex: 0 0 auto; min-height: 36px; padding: 4px 10px; font: inherit; font-size: 13px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; cursor: pointer; }
  .samples { grid-column: 1 / -1; }
  .app-foot { max-width: 1100px; margin: 0 auto; padding: 4px 16px 24px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .app-foot a { color: var(--muted); }
  /* 쓴 글자 캐러셀: 쓰기 칸 모양 그대로 작게 쌓이고 옆으로 넘겨 본다 */
  .carousel-wrap { width: 100%; }
  .carousel-wrap .empty { text-align: center; margin: 4px 0; }
  .carousel { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity; padding: 4px 2px 10px; -webkit-overflow-scrolling: touch; }
  .thumb { flex: 0 0 auto; width: 96px; padding: 5px; position: relative; scroll-snap-align: end; border: 1px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; font: inherit; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }
  .thumb[aria-current="true"] { border: 2px solid var(--accent); padding: 4px; }
  .thumb canvas { width: 100%; aspect-ratio: 1; display: block; border: 1px solid var(--line); border-radius: 8px; touch-action: auto; }
  .thumb .badge { position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 700; color: #fff; border-radius: 6px; padding: 1px 5px; }
  .thumb .cap { font-size: 12px; color: var(--muted); text-align: center; }
  .calib-sum { font-size: 14px; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 10px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  tr.off td { color: var(--bad); }
  button.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
  .samples .toolbar { justify-content: flex-start; }
</style>
</head>
<body>
<main>
  <section class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-group="consonant">자음</button>
      <button class="tab" role="tab" data-group="vowel">모음</button>
    </div>
    <h2><span id="groupName">자음</span> 연습 <span id="progress"></span></h2>
    <div class="grid" id="charGrid"></div>
  </section>

  <section class="panel stage">
    <div class="toolbar">
      <button class="btn" id="animBtn">▶ 획순 보기</button>
      <button class="btn" id="clearBtn">↺ 다시 쓰기</button>
      <button class="btn primary" id="doneBtn">다 썼어요</button>
      <button class="btn" id="modelBtn" type="button" aria-pressed="true" aria-controls="modelWrap">획순 시범</button>
    </div>
    <div class="pad-row" id="padRow">
    <div class="pad-wrap" id="padWrap">
      <canvas id="pad" width="420" height="420"></canvas>
      <div class="pad-resize" id="padResize" role="slider" tabindex="0" aria-label="쓰기 칸 크기" aria-valuemin="200" title="끌어서 칸 크기 조절"></div>
      <span class="pad-size-label" id="padSizeLabel"></span>
      <svg class="auto-timer" id="autoTimer" viewBox="0 0 36 36" role="img" aria-label="자동 제출까지 남은 시간">
        <circle class="track" cx="18" cy="18" r="15"></circle>
        <circle class="ring" id="autoRing" cx="18" cy="18" r="15"></circle>
        <text id="autoNum" x="18" y="18"></text>
      </svg>
    </div>
    <div class="model-wrap" id="modelWrap">
      <canvas id="model" width="420" height="420" role="img" aria-label="획순 시범"></canvas>
      <div class="model-bar">
        <span class="model-cap">보고 따라 써요</span>
        <button class="model-play" id="modelPlay" type="button" aria-label="획순 시범 멈추기">❚❚</button>
      </div>
    </div>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="carousel-wrap">
      <div class="carousel" id="carousel" role="list" aria-label="쓴 글자 모음"></div>
      <p class="empty" id="carouselEmpty">다 쓴 글자가 여기에 차례로 쌓여요. 눌러서 다시 볼 수 있어요.</p>
    </div>
    <div class="toolbar">
      <select id="device" aria-label="입력 기기">
        <option value="finger">손가락 (너그럽게)</option>
        <option value="pen">펜 (정확하게)</option>
        <option value="board">전자칠판</option>
      </select>
      <label class="toggle"><input type="checkbox" id="guided"> 획순 지키기 (틀린 획은 바로 지움)</label>
      <label class="toggle"><input type="checkbox" id="guideOn" checked> 안내선</label>
      <label class="toggle"><input type="checkbox" id="penOnly"> 펜슬만 받기 (손바닥 터치 무시)</label>
      <label class="toggle"><input type="checkbox" id="voiceOn" checked> 소리로 알려 주기</label>
      <label class="toggle">자동 제출 <input type="number" id="autoSec" min="0" max="10" step="0.5" value="3" inputmode="decimal"> 초 (0이면 끔)</label>
    </div>
  </section>

  <section class="panel" id="result"><p class="empty">글자를 쓰고 '다 썼어요'를 누르세요.</p></section>

  <section class="panel samples" id="samples" aria-label="채점 표본"></section>
</main>
<footer class="app-foot">
  <span>한글 쓰기 연습 · 운영 김경민</span>
  <a href="/privacy">개인정보처리방침</a>
  <a href="/terms">이용약관</a>
  <a href="mailto:themaniwant19@gmail.com">문의</a>
</footer>

</body>
</html>
