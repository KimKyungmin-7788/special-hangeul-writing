<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>한글 쓰기 엔진 확인</title>
<style>
  /* 앱마다 바꿀 디자인 변수 */
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d2433; --muted: #6b7280; --line: #e3e1da;
    --accent: #3b5bdb; --good: #2f9e44; --warn: #e8590c; --bad: #c92a2a;
    --guide: rgba(59, 91, 219, 0.13); --pen: #1d2433; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  main { display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; gap: 16px; max-width: 1100px; margin: 0 auto; padding: 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab { flex: 1; font: inherit; font-size: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 8px; min-height: 40px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  @media (max-width: 860px) { .grid { grid-template-columns: repeat(7, 1fr); } }
  .cell { position: relative; aspect-ratio: 1; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 24px; font-weight: 700; color: var(--ink); cursor: pointer; }
  .cell[aria-current="true"] { border: 2px solid var(--accent); }
  .cell .badge { position: absolute; top: 3px; right: 4px; font-size: 10px; font-weight: 700; color: #fff; border-radius: 6px; padding: 1px 4px; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button.btn, select { font: inherit; font-size: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 9px 14px; min-height: 42px; cursor: pointer; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  label.toggle { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  /* 쓰기 칸: 오른쪽 아래 손잡이를 끌어 크기를 바꾼다(--pad-size) */
  .pad-wrap { position: relative; width: min(100%, var(--pad-size, 420px)); }
  .pad-resize { position: absolute; right: -14px; bottom: -14px; width: 40px; height: 40px; border-radius: 50%; touch-action: none; cursor: nwse-resize; display: flex; align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .pad-resize::before { content: ""; width: 14px; height: 14px; border-right: 3px solid var(--muted); border-bottom: 3px solid var(--muted); border-radius: 0 0 3px 0; }
  .pad-resize:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .pad-size-label { position: absolute; right: 32px; bottom: -12px; font-size: 12px; color: var(--muted); background: var(--panel); padding: 2px 6px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .pad-wrap.resizing .pad-size-label { opacity: 1; }
  canvas { width: 100%; aspect-ratio: 1; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .toast { min-height: 22px; font-size: 15px; color: var(--warn); font-weight: 600; }
  .score { display: flex; align-items: baseline; gap: 8px; }
  .score b { font-size: 48px; }
  .grade { font-size: 18px; font-weight: 700; padding: 2px 8px; border-radius: 8px; color: #fff; }
  .bar { display: grid; grid-template-columns: 70px 1fr 36px; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
  .bar i { display: block; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar i span { display: block; height: 100%; background: var(--accent); }
  ul { padding-left: 18px; margin: 10px 0 0; font-size: 14px; line-height: 1.6; }
  .empty { color: var(--muted); font-size: 14px; }
  .calib { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .calib label { font-size: 13px; color: var(--muted); }
  .calib-row { display: flex; gap: 6px; margin-top: 6px; }
  .calib-row input { font: inherit; font-size: 16px; width: 90px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 42px; }
  .calib-msg { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .samples { grid-column: 1 / -1; }
  .calib-sum { font-size: 14px; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 10px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  tr.off td { color: var(--bad); }
  button.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
  .samples .toolbar { justify-content: flex-start; }
</style>
</head>
<body>
<main>
  <section class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-group="consonant">자음</button>
      <button class="tab" role="tab" data-group="vowel">모음</button>
    </div>
    <h2><span id="groupName">자음</span> 연습 <span id="progress"></span></h2>
    <div class="grid" id="charGrid"></div>
  </section>

  <section class="panel stage">
    <div class="toolbar">
      <button class="btn" id="animBtn">▶ 획순 보기</button>
      <button class="btn" id="clearBtn">↺ 다시 쓰기</button>
      <button class="btn primary" id="doneBtn">다 썼어요</button>
    </div>
    <div class="pad-wrap" id="padWrap">
      <canvas id="pad" width="420" height="420"></canvas>
      <div class="pad-resize" id="padResize" role="slider" tabindex="0" aria-label="쓰기 칸 크기" aria-valuemin="200" title="끌어서 칸 크기 조절"></div>
      <span class="pad-size-label" id="padSizeLabel"></span>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="toolbar">
      <select id="device" aria-label="입력 기기">
        <option value="finger">손가락 (너그럽게)</option>
        <option value="pen">펜 (정확하게)</option>
        <option value="board">전자칠판</option>
      </select>
      <label class="toggle"><input type="checkbox" id="guided"> 획순 지키기 (틀린 획은 바로 지움)</label>
      <label class="toggle"><input type="checkbox" id="guideOn" checked> 안내선</label>
      <label class="toggle"><input type="checkbox" id="penOnly"> 펜슬만 받기 (손바닥 터치 무시)</label>
    </div>
  </section>

  <section class="panel" id="result"><p class="empty">글자를 쓰고 '다 썼어요'를 누르세요.</p></section>

  <section class="panel samples" id="samples" aria-label="채점 표본"></section>
</main>
<script type="module" src="./demo.js"></script>
</body>
</html>
